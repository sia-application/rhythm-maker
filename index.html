<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RHYTHM MAKER PRO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Noto+Sans+JP:wght@300;400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f1115">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Rhythm Maker PRO">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" href="icon-192.png"> <!-- Suppress favicon 404 and use icon -->
</head>

<body>
    <div id="app">
        <header class="app-header">
            <h1 onclick="location.reload()" style="cursor: pointer;">RHYTHM MAKER PRO <span
                    style="font-size: 14px; font-weight: 400; opacity: 0.7; margin-left: 8px; -webkit-text-fill-color: #aaa; background: none;">v1.8.4</span>
            </h1>
            <div class="header-controls">
                <button id="header-new-project-btn" class="btn-secondary">New Project</button>
                <button id="view-toggle-btn" class="btn-secondary">Game Mode</button>
                <button id="preset-btn" class="btn-secondary">Share URL</button>
                <button id="config-btn" class="btn-secondary">Config</button>
            </div>
        </header>

        <!-- Config Side Panel -->
        <div id="config-panel" class="preset-panel hidden">
            <div class="preset-panel-header">
                <h2>CONFIG</h2>
                <button id="config-panel-close" class="preset-close-btn">✕</button>
            </div>

            <div class="config-scroll-area">
                <div class="config-section">
                    <h3>RHYTHM CONFIG</h3>
                    <div class="config-item">
                        <label>BPM</label>
                        <div class="input-row">
                            <input type="number" id="config-bpm-number" min="20" max="999" value="120"
                                class="number-input">
                            <input type="range" id="config-bpm-input" min="20" max="999" value="120">
                        </div>
                    </div>
                    <div class="config-item">
                        <label>Volume</label>
                        <div class="input-row">
                            <input type="number" id="config-vol-number" min="0" max="500" value="50"
                                class="number-input">
                            <input type="range" id="config-master-vol" min="0" max="5" step="0.01" value="0.5"
                                class="range-input">
                        </div>
                    </div>
                    <div class="config-item">
                        <label>Time Sig</label>
                        <select id="config-time-sig-select" class="select-input"></select>
                    </div>
                    <div class="config-item">
                        <label>Subdivision</label>
                        <select id="config-subdiv-select" class="select-input"></select>
                    </div>
                    <div class="config-item">
                        <label>Playback</label>
                        <select id="config-playback-mode-select" class="select-input"></select>
                    </div>
                    <div class="config-item">
                        <label>Step Sound</label>
                        <select id="config-step-sound-select" class="select-input"></select>
                    </div>
                    <div class="config-item">
                        <label>Selected Notes</label>
                        <div class="input-row">
                            <button id="config-reset-btn" class="action-btn">Reset</button>
                        </div>
                    </div>
                </div>

                <div class="config-section">
                    <h3>GAME CONFIG</h3>
                    <div class="config-item">
                        <label>Speed: <span id="config-game-speed-val">1.0</span></label>
                        <input type="range" id="config-game-speed-slider" min="0.5" max="10" step="0.5" value="1.0">
                    </div>
                    <div class="config-item">
                        <label>Off-Beat Mode</label>
                        <select id="config-offbeat-mode-select" class="select-input">
                            <option value="off">OFF (Standard)</option>
                            <option value="on">ON (Invert Game Notes)</option>
                        </select>
                    </div>
                    <div class="config-item">
                        <label>Hit Criteria</label>
                        <select id="config-hit-criteria-select" class="select-input"></select>
                    </div>
                    <div class="config-item">
                        <label>Hit Sound</label>
                        <select id="config-hit-sound-select" class="select-input">
                            <option value="mute">Mute</option>
                            <option value="sound">Sound ON</option>
                        </select>
                    </div>
                    <div class="config-item">
                        <label>Hit Sound Type</label>
                        <select id="config-hit-sound-type-select" class="select-input"></select>
                    </div>
                    <div class="config-item">
                        <label>Game Results</label>
                        <div class="input-row">
                            <button id="config-result-reset-btn" class="action-btn">Reset</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div id="config-overlay" class="preset-overlay hidden"></div>

        <!-- Preset Side Panel -->
        <div id="preset-panel" class="preset-panel hidden">
            <div class="preset-panel-header">
                <h2>PRESET</h2>
                <button id="preset-panel-close" class="preset-close-btn">✕</button>
            </div>
            <div class="preset-actions">
                <button id="save-new-btn" class="btn-primary">💾 Save The Preset</button>
            </div>
            <div class="preset-folders">
                <h3>📁 Project</h3>
                <div id="folder-form" class="folder-form hidden">
                    <input type="text" id="folder-name-input" placeholder="Project Name" class="folder-input">
                    <button id="folder-create-btn" class="btn-primary folder-create-btn">Create</button>
                    <button id="folder-cancel-btn" class="folder-cancel-btn">✕</button>
                </div>
                <button id="add-folder-btn" class="btn-secondary folder-add-btn">+ New Project</button>
                <div id="folder-list" class="folder-list"></div>
            </div>
            <div class="preset-list-section">
                <h3>🎵 Preset List</h3>
                <div id="preset-list" class="preset-list"></div>
            </div>
            <div class="share-url-section">
                <div class="share-url-row">
                    <button id="generate-url-btn" class="btn-icon" title="Generate Share URL">🔗</button>
                    <div id="share-url-display" class="share-url-display">
                        <input type="text" id="share-url-input" readonly class="share-url-input"
                            placeholder="Click to generate URL">
                        <button id="copy-url-btn" class="btn-secondary copy-url-btn">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                                <path
                                    d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div id="preset-overlay" class="preset-overlay hidden"></div>

        <!-- Track Settings Side Panel -->
        <div id="track-settings-panel" class="preset-panel hidden">
            <div class="preset-panel-header">
                <h2 id="track-settings-title">TRACK SETTINGS</h2>
                <button id="track-settings-panel-close" class="preset-close-btn">✕</button>
            </div>
            <div class="config-scroll-area">
                <div class="config-section">
                    <h3>INSTRUMENT</h3>
                    <div class="config-item">
                        <label>Select Sound</label>
                        <select id="track-inst-panel-select" class="select-input"></select>
                    </div>
                    <button id="sync-inst-all-btn" class="btn-secondary sync-btn">Apply to all bars</button>
                </div>
                <div class="config-section">
                    <h3>TRACK CONFIG</h3>
                    <div class="config-item">
                        <label>Track Volume</label>
                        <div class="input-row">
                            <input type="number" id="track-vol-number" min="0" max="100" value="100"
                                class="number-input">
                            <input type="range" id="track-vol-range" min="0" max="1" step="0.01" value="1.0">
                        </div>
                    </div>
                    <button id="sync-vol-all-btn" class="btn-secondary sync-btn">Apply to all bars</button>
                </div>
                <div class="config-section">
                    <h3>DANGER ZONE</h3>
                    <div class="config-item">
                        <button id="track-delete-btn" class="btn-primary"
                            style="background: var(--secondary-color); color: white; width: 100%;">Delete Track</button>
                    </div>
                </div>
            </div>
        </div>
        <div id="track-settings-overlay" class="preset-overlay hidden"></div>

        <!-- Save Dialog -->
        <div id="save-dialog" class="save-dialog hidden">
            <div class="save-dialog-content">
                <h3>Save The Preset</h3>
                <div class="save-form-group">
                    <label for="preset-name-input">Preset Name</label>
                    <input type="text" id="preset-name-input" placeholder="Enter Preset Name" class="save-input">
                </div>
                <div class="save-form-group">
                    <label for="preset-folder-select">Project</label>
                    <select id="preset-folder-select" class="save-select">
                        <option value="">Root（No Project）</option>
                    </select>
                </div>
                <div class="save-dialog-buttons">
                    <button id="save-cancel-btn" class="btn-secondary">Cancel</button>
                    <button id="save-confirm-btn" class="btn-primary">Save</button>
                </div>
            </div>
        </div>


        <main>
            <div class="controls-bar glass-panel">
                <div class="control-group">
                    <button id="play-btn" class="icon-btn glass-icon-btn play-glow">
                        <svg viewBox="0 0 24 24" class="control-svg">
                            <path d="M8 5v14l11-7z" fill="currentColor" />
                        </svg>
                    </button>
                    <button id="stop-btn" class="icon-btn glass-icon-btn stop-glow">
                        <svg viewBox="0 0 24 24" class="control-svg">
                            <rect x="6" y="6" width="12" height="12" fill="currentColor" />
                        </svg>
                    </button>

                    <div class="input-row" style="margin-left: 10px;">
                        <span
                            style="font-size: 0.8rem; color: var(--text-muted); font-weight: 600; margin-right: 5px;">BPM</span>
                        <input type="number" id="bpm-number" min="20" max="999" value="120" class="number-input">
                        <input type="range" id="bpm-input" min="20" max="999" value="120">
                    </div>
                </div>

                <div id="current-preset-info" class="current-preset-info">
                    <span class="info-label">PROJECT:</span>
                    <span id="current-project-name" class="info-value">None</span>
                    <span class="info-sep">/</span>
                    <span class="info-label">PRESET:</span>
                    <span id="current-preset-name" class="info-value">None</span>
                </div>

                <div class="control-group step-action-dropdown">
                    <label for="step-action-select">Step Tools</label>
                    <select id="step-action-select" class="select-input">
                        <optgroup label="Stepの選択/選択解除">
                            <option value="sel-step" selected>1つのみ</option>
                            <option value="sel-col">縦1列全て</option>
                            <option value="sel-bar-col">Bar内の縦1列全て</option>
                            <option value="sel-col-track">同Track番号の縦1列全て</option>
                            <option value="sel-bar">Bar内の同STEP番号の縦一列全て</option>
                            <option value="sel-bar-track">Bar内の同Trackの同Step番号全て</option>
                            <option value="sel-global">Project全体の同STEP番号全て</option>
                            <option value="sel-global-track">Project全体の同Trackの同STEP番号全て</option>
                            <!-- <option value="sel-bar-row">Bar内の同Track全て</option> -->
                            <!-- <option value="sel-bar-all">Bar内全て</option> -->
                            <option value="sel-global-all">Project全て</option>
                        </optgroup>
                        <optgroup label="Stepの選択/選択解除(ゲーム反映なし)">
                            <option value="sel-nogame-step">1つのみ</option>
                            <option value="sel-nogame-col">縦1列全て</option>
                            <option value="sel-nogame-bar-col">Bar内の縦1列全て</option>
                            <option value="sel-nogame-col-track">同Track番号の縦1列全て</option>
                            <option value="sel-nogame-bar">Bar内の同STEP番号の縦一列全て</option>
                            <option value="sel-nogame-bar-track">Bar内の同Trackの同Step番号全て</option>
                            <option value="sel-nogame-global">Project全体の同STEP番号全て</option>
                            <option value="sel-nogame-global-track">Project全体の同Trackの同STEP番号全て</option>
                            <!-- <option value="sel-nogame-bar-row">Bar内の同Track全て</option> -->
                            <!-- <option value="sel-nogame-bar-all">Bar内の全て</option> -->
                            <option value="sel-nogame-global-all">Project全体の全て</option>
                        </optgroup>
                        <optgroup label="Stepの追加（右）">
                            <option value="add-step">１つのみ</option>
                            <option value="add-col">縦一列全て</option>
                            <option value="add-bar">Bar内縦一列全て</option>
                            <option value="add-global">Project全体の同STEP番号全て</option>
                        </optgroup>
                        <optgroup label="Stepの削除">
                            <option value="del-step">１つのみ</option>
                            <option value="del-col">縦一列全て</option>
                            <option value="del-bar">Bar内縦一列全て</option>
                            <option value="del-global">Project全体の同STEP番号全て</option>
                        </optgroup>
                    </select>
                </div>
            </div>

            <div id="sequencer-view" class="active-view">
                <div class="sequencer-container glass-panel">
                    <!-- Grid will be generated here -->
                    <div id="sequencer-grid" class="sequencer-grid"></div>
                </div>
            </div>

            <div id="game-view" class="hidden glass-panel">
                <div class="game-header">
                    <div class="score-container">SCORE: <span id="game-score">0</span></div>
                    <div class="note-counter-container">NOTES: <span id="game-hits">0</span> / <span
                            id="game-total-notes">0</span></div>
                    <div class="combo-container"><span id="game-combo">0</span> COMBO</div>
                </div>

                <div id="countdown-overlay" class="hidden">
                    <div class="countdown-number"></div>
                </div>

                <div id="game-lanes" class="game-lanes">
                    <!-- Lanes will be generated in JS -->
                </div>
                <div class="game-footer">
                    <p class="game-hint">PRESS SPACE OR TAP LANES TO PLAY</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script src="script.js"></script>
</body>

</html>
