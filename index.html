<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhythm Maker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Noto+Sans+JP:wght@300;400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:,"> <!-- Suppress favicon 404 -->
</head>

<body>
    <div id="app">
        <header class="app-header">
            <h1>RHYTHM MAKER</h1>
            <div class="header-controls">
                <!-- Game Mode button removed -->
            </div>
        </header>

        <main>
            <div class="controls-bar glass-panel">
                <div class="control-group">
                    <button id="play-btn" class="btn-primary icon-btn">
                        <span class="icon-play">▶</span>
                    </button>
                    <button id="stop-btn" class="btn-danger icon-btn">
                        <span class="icon-stop">■</span>
                    </button>
                </div>

                <div class="control-group">
                    <label for="bpm-input">BPM: <span id="bpm-display">120</span></label>
                    <input type="range" id="bpm-input" min="20" max="999" value="120">
                </div>

                <div class="control-group">
                    <label>Time Sig</label>
                    <select id="time-sig-select" class="select-input">
                        <option value="4">4/4</option>
                        <option value="3">3/4</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>Set All</label>
                    <select id="subdiv-select" class="select-input">
                        <option value="1">4分音符</option>
                        <option value="2">8分音符</option>
                        <option value="4" selected>16分音符</option>
                        <option value="8">32分</option>
                        <option value="3">3連符</option>
                        <option value="6">6連符</option>
                        <option value="9">9連符</option>
                        <option value="12">12連符</option>
                    </select>
                </div>

                <div class="control-group">
                    <button id="reset-btn" class="btn-text">Reset</button>
                </div>
            </div>

            <div id="sequencer-view" class="active-view">
                <div class="sequencer-container glass-panel">
                    <!-- Grid will be generated here -->
                    <div id="sequencer-grid" class="sequencer-grid"></div>
                </div>
            </div>

            <!-- Game View removed -->
        </main>
    </div>

    <div id="context-menu" class="hidden">
        <div class="menu-item" id="ctx-add-step">ステップを1つ追加</div>
        <div class="menu-item" id="ctx-add-step-all">列全体のステップを1つ追加</div>
        <div class="menu-item" id="ctx-add-step-bar">全体にステップを1つ追加</div>
        <div class="menu-item" id="ctx-del-step">ステップを削除</div>
        <div class="menu-item" id="ctx-del-step-all">列全体のステップを1つ削除</div>
        <div class="menu-item" id="ctx-del-step-bar">全体にステップを1つ削除</div>
    </div>
    <script src="script.js"></script>
</body>

</html>
