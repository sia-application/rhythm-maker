<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhythm Maker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Noto+Sans+JP:wght@300;400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:,"> <!-- Suppress favicon 404 -->
</head>

<body>
    <div id="app">
        <header class="app-header">
            <h1>RHYTHM MAKER</h1>
            <div class="header-controls">
                <!-- Game Mode button removed -->
            </div>
        </header>

        <main>
            <div class="controls-bar glass-panel">
                <div class="control-group">
                    <button id="play-btn" class="icon-btn glass-icon-btn play-glow">
                        <svg viewBox="0 0 24 24" class="control-svg">
                            <path d="M8 5v14l11-7z" fill="currentColor" />
                        </svg>
                    </button>
                    <button id="stop-btn" class="icon-btn glass-icon-btn stop-glow">
                        <svg viewBox="0 0 24 24" class="control-svg">
                            <rect x="6" y="6" width="12" height="12" fill="currentColor" />
                        </svg>
                    </button>
                </div>

                <div class="control-group">
                    <label for="bpm-input">BPM</label>
                    <div class="input-row">
                        <input type="number" id="bpm-number" min="20" max="999" value="120" class="number-input">
                        <input type="range" id="bpm-input" min="20" max="999" value="120">
                    </div>
                </div>

                <div class="control-group">
                    <label for="master-vol">Volume</label>
                    <div class="input-row">
                        <input type="number" id="vol-number" min="0" max="500" value="50" class="number-input">
                        <input type="range" id="master-vol" min="0" max="5" step="0.01" value="0.5" class="range-input">
                    </div>
                </div>

                <div class="control-group">
                    <label>Time Sig</label>
                    <select id="time-sig-select" class="select-input">
                        <option value="4">4/4</option>
                        <option value="3">3/4</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>Subdivision</label>
                    <select id="subdiv-select" class="select-input">
                        <option value="1">4分音符</option>
                        <option value="2">8分音符</option>
                        <option value="4" selected>16分音符</option>
                        <option value="8">32分音符</option>
                        <option value="16">64分音符</option>
                        <option value="3">3連符</option>
                        <option value="6">6連符</option>
                        <option value="9">9連符</option>
                        <option value="12">12連符</option>
                    </select>
                </div>

                <div class="control-group">
                    <button id="reset-btn" class="btn-text">Reset</button>
                </div>
            </div>

            <div id="sequencer-view" class="active-view">
                <div class="sequencer-container glass-panel">
                    <!-- Grid will be generated here -->
                    <div id="sequencer-grid" class="sequencer-grid"></div>
                </div>
            </div>

            <!-- Game View removed -->
        </main>
    </div>

    <div id="context-menu" class="hidden">
        <div class="menu-item" id="ctx-add-step">ステップを右隣に追加</div>
        <div class="menu-item" id="ctx-add-step-all">列全体にステップを右隣に追加</div>
        <div class="menu-item" id="ctx-add-step-bar">Bar全体にステップを右隣に追加</div>
        <div class="menu-item" id="ctx-add-step-global">全てのSTEPの右隣にステップを追加</div>
        <hr class="menu-sep">
        <div class="menu-item" id="ctx-del-step">指定したステップを削除</div>
        <div class="menu-item" id="ctx-del-step-all">指定したステップの列全てを削除</div>
        <div class="menu-item" id="ctx-del-step-bar">指定した位置のステップをBarから全て削除</div>
        <hr class="menu-sep">
        <div class="menu-item" id="ctx-sel-step">ステップを1つ選択</div>
        <div class="menu-item" id="ctx-sel-col">列全体のステップを1つ選択</div>
        <div class="menu-item" id="ctx-sel-all">全体にステップを1つ選択</div>
        <hr class="menu-sep">
        <div class="menu-item" id="ctx-unsel-step">ステップを1つ選択解除</div>
        <div class="menu-item" id="ctx-unsel-col">列全体のステップを1つ選択解除</div>
        <div class="menu-item" id="ctx-unsel-all">全体にステップを1つ選択解除</div>
    </div>
    <script src="script.js"></script>
</body>

</html>
